name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ecommerce.txt

      - name: Install dependencies
        run: pip install -r requirements-ecommerce.txt

      # 电商子集 259 用例: FileHTMLSource 离线读 fixtures + LLM 走 stub,
      # 不需要真实 Chrome / CDP / API key, 在 ubuntu runner 上可直接跑。
      # test_ctrip_* / test_pdd_cdp_* 需要桌面 CDP 通道, 不进 CI。
      - name: Run ecommerce tests
        # 用 `python -m pytest` 而非裸 pytest: -m 会把 repo root 加进 sys.path,
        # tests/conftest.py 里的 `import app` 依赖这一点 (与本地跑法一致)。
        run: python -m pytest -q tests/test_ecommerce_*.py

      # scripts/ 没有测试覆盖, 必须有静态检查兜底: py_compile 只查语法不查名字
      # (B-77, 曾因 CDP_CONNECT_TIMEOUT_MS 未定义漏出 NameError 假绿)。
      # ruff F821 = 未定义名; 覆盖 app/ 与 scripts/。--isolated 忽略仓库内 pyproject 配置。
      - name: Static check (undefined names, F821)
        run: |
          pip install ruff
          ruff check --select F821 --isolated --no-cache app scripts
