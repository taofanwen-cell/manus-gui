<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼多多竞品调研 · 数据大屏</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/vendor/echarts-wordcloud.min.js"></script>
  <style>
    :root {
      --bg-0: #070d1a;
      --bg-1: #0a1628;
      --bg-2: #0d1b2e;
      --panel: rgba(13, 42, 80, .55);
      --panel-solid: #0c2038;
      --line: rgba(0, 224, 255, .18);
      --line-strong: rgba(0, 224, 255, .45);
      --cyan: #00eaff;
      --cyan-dim: #22d3ee;
      --blue: #38bdf8;
      --text: #cfe3f5;
      --text-dim: #7f9cc0;
      --gold: #f5c518;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: radial-gradient(1200px 600px at 20% -10%, #0d2a4d 0%, var(--bg-0) 60%), var(--bg-1);
      color: var(--text); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      overflow-x: hidden;
    }
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

    /* ---------- 侧边栏 ---------- */
    .sidebar {
      background: linear-gradient(180deg, #081020, #0a1628);
      border-right: 1px solid var(--line); padding: 18px 0;
      position: sticky; top: 0; height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 8px 20px 20px; }
    .brand .logo {
      width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #04121f; font-weight: 800; font-size: 18px;
      box-shadow: 0 0 16px rgba(0, 224, 255, .5);
    }
    .brand .name { font-weight: 700; font-size: 15px; letter-spacing: .5px; }
    .brand .sub { font-size: 11px; color: var(--text-dim); }
    .menu { margin-top: 6px; }
    .menu-item {
      display: flex; align-items: center; gap: 10px; padding: 12px 20px; cursor: pointer;
      color: var(--text-dim); font-size: 14px; border-left: 3px solid transparent; transition: .15s;
    }
    .menu-item:hover { color: var(--text); background: rgba(0,224,255,.06); }
    .menu-item.active { color: var(--cyan); background: rgba(0,224,255,.1); border-left-color: var(--cyan); }
    .menu-item .ico { width: 18px; text-align: center; }

    /* ---------- 主区 ---------- */
    .main { padding: 16px 22px 40px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .topbar .title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .topbar .title .hl { color: var(--cyan); }
    .topbar .time { font-size: 12px; color: var(--text-dim); }

    /* ---------- 条件面板 ---------- */
    .ctrl {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 16px 18px; margin-bottom: 18px; backdrop-filter: blur(4px);
    }
    .ctrl .lbl { font-size: 13px; color: var(--cyan-dim); margin-bottom: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 16px;
      background: rgba(0,224,255,.1); border: 1px solid rgba(0,224,255,.3); color: var(--cyan); cursor: pointer; font-size: 13px;
    }
    .chip.off { background: rgba(120,150,180,.08); border-color: rgba(120,150,180,.2); color: #8aa0b8; }
    .chip .x { opacity: .6; }
    .c-input {
      background: rgba(0,0,0,.25); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 6px 12px; width: 140px; font-size: 13px;
    }
    .c-input:focus { outline: none; border-color: var(--cyan); }
    .btn-glow {
      background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #04121f; font-weight: 700;
      border: none; border-radius: 8px; padding: 9px 22px; font-size: 14px;
      box-shadow: 0 0 18px rgba(0,224,255,.45); cursor: pointer; transition: .15s;
    }
    .btn-glow:hover { transform: translateY(-1px); box-shadow: 0 0 24px rgba(0,224,255,.7); }
    .btn-glow:disabled { opacity: .5; cursor: not-allowed; }

    /* ---------- KPI ---------- */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
    .kpi {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px;
      position: relative; overflow: hidden;
    }
    .kpi::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, transparent, rgba(0,224,255,.06)); }
    .kpi .v { font-size: 30px; font-weight: 800; color: var(--cyan); letter-spacing: .5px; }
    .kpi .k { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
    .kpi .trend { font-size: 12px; margin-top: 6px; color: var(--gold); }

    /* ---------- 网格面板 ---------- */
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
      position: relative;
    }
    .panel .h5 { font-size: 14px; color: var(--cyan-dim); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .panel .h5 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .chart { width: 100%; height: 260px; }
    .chart.tall { height: 300px; }

    /* ---------- 洞察 ---------- */
    .insight { border-left: 3px solid; padding: 8px 12px; margin-bottom: 10px; background: rgba(0,0,0,.15); border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .insight-tier { border-color: var(--cyan); }
    .insight-hot { border-color: var(--gold); }
    .insight-gap { border-color: var(--blue); }
    .insight-warning { border-color: #f87171; }
    .insight .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(0,224,255,.15); color: var(--cyan); white-space: nowrap; }
    .insight-warning .tag { background: rgba(248,113,113,.15); color: #f87171; }
    .insight-hot .tag { background: rgba(245,197,24,.15); color: var(--gold); }

    /* ---------- 表格 ---------- */
    .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data th, table.data td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(120,150,180,.12); }
    table.data th { color: var(--cyan-dim); font-weight: 600; }
    table.data tbody tr:hover { background: rgba(0,224,255,.05); }
    .bar-mini { display: inline-block; height: 7px; border-radius: 3px; background: linear-gradient(90deg, var(--cyan), var(--blue)); }

    /* 四角发光角标 */
    .corner { position: absolute; width: 14px; height: 14px; border-color: var(--line-strong); border-style: solid; }
    .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .loading-ring { width: 22px; height: 22px; border: 3px solid rgba(0,224,255,.25); border-top-color: var(--cyan); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 26px; }
    .view { display: none; }
    .view.show { display: block; }
  </style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">竞</div>
      <div>
        <div class="name">竞品情报大屏</div>
        <div class="sub">拼多多 · 蓝牙耳机</div>
      </div>
    </div>
    <div class="menu">
      <div class="menu-item active" data-view="overview"><span class="ico">📊</span> 总览大屏</div>
      <div class="menu-item" data-view="price"><span class="ico">📈</span> 价格分析</div>
      <div class="menu-item" data-view="wordcloud"><span class="ico">☁️</span> 卖点词云</div>
      <div class="menu-item" data-view="table"><span class="ico">📋</span> 品牌对比</div>
    </div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <div class="topbar">
      <div class="title">拼多多 <span class="hl">蓝牙耳机</span> 竞品调研</div>
      <div class="time" id="clock"></div>
    </div>

    <!-- 条件面板 -->
    <div class="ctrl">
      <div class="lbl">▸ 选择对比品牌</div>
      <div class="chips" id="chips"></div>
      <div class="chips" style="margin-top:10px;">
        <input class="c-input" id="custom-input" placeholder="加自定义品牌, 如 OPPO" maxlength="16">
        <button class="btn-glow" style="padding:7px 14px;" id="add-btn">+ 添加</button>
        <span style="width:18px;"></span>
        <button class="btn-glow" id="generate-btn">⚡ 生成报告</button>
        <span class="loading-ring" id="loading" style="display:none;"></span>
      </div>
    </div>

    <!-- 总览大屏 -->
    <section class="view show" id="view-overview">
      <div class="kpis" id="kpis"></div>
      <div class="grid">
        <div class="panel"><span class="corner tl"></span><span class="corner br"></span>
          <div class="h5"><span class="dot"></span> 各品牌价格中位数 (¥)</div>
          <div class="chart" id="chart-price"></div>
        </div>
        <div class="panel"><span class="corner tl"></span><span class="corner br"></span>
          <div class="h5"><span class="dot"></span> 各品牌单品销量 (件)</div>
          <div class="chart" id="chart-sales"></div>
        </div>
        <div class="panel"><span class="corner tl"></span><span class="corner br"></span>
          <div class="h5"><span class="dot"></span> 销量占比</div>
          <div class="chart" id="chart-donut"></div>
        </div>
      </div>
      <div class="grid grid-2" style="margin-top:16px;">
        <div class="panel"><span class="corner tl"></span><span class="corner br"></span>
          <div class="h5"><span class="dot"></span> 业务洞察</div>
          <div id="insights"></div>
        </div>
        <div class="panel"><span class="corner tl"></span><span class="corner br"></span>
          <div class="h5"><span class="dot"></span> 建议关注</div>
          <div id="gap-notes" class="text-muted" style="font-size:13px;color:var(--text-dim)"></div>
        </div>
      </div>
    </section>

    <!-- 价格分析 -->
    <section class="view" id="view-price">
      <div class="panel"><span class="corner tl"></span><span class="corner br"></span>
        <div class="h5"><span class="dot"></span> 各品牌价格分档分布 (¥100以内 / 100-300 / 300-800 / 800+)</div>
        <div class="chart tall" id="chart-bucket"></div>
      </div>
      <div class="grid grid-2" style="margin-top:16px;">
        <div class="panel"><span class="corner tl"></span><span class="corner br"></span>
          <div class="h5"><span class="dot"></span> 价格区间对比</div>
          <div class="chart" id="chart-range"></div>
        </div>
        <div class="panel"><span class="corner tl"></span><span class="corner br"></span>
          <div class="h5"><span class="dot"></span> 高频卖点分布</div>
          <div class="chart" id="chart-keywords"></div>
        </div>
      </div>
    </section>

    <!-- 词云 -->
    <section class="view" id="view-wordcloud">
      <div class="panel"><span class="corner tl"></span><span class="corner br"></span>
        <div class="h5"><span class="dot"></span> 卖点关键词云 (字号=出现频次)</div>
        <div class="chart tall" id="chart-wordcloud" style="height:340px;"></div>
      </div>
    </section>

    <!-- 品牌对比表 -->
    <section class="view" id="view-table">
      <div class="table-wrap">
        <div class="h5" style="font-size:14px;color:var(--cyan-dim);margin-bottom:12px;"><span class="dot"></span> 品牌对比明细表</div>
        <table class="data">
          <thead><tr id="table-head"></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>

    <div class="footer">数据来源：拼多多搜索列表真实数据 · 本机登录 CDP 只读扫描 · FastAPI · ECharts</div>
  </main>
</div>

<script>
const DEFAULT_BRANDS = ['华为', '小米', '倍思', 'QCY', '万魔', '漫步者'];
let selected = new Set(DEFAULT_BRANDS);
const charts = {};
let reportData = null;

const $ = id => document.getElementById(id);
const COLORS = ['#00eaff', '#38bdf8', '#a78bfa', '#f5c518', '#f472b6', '#34d399', '#fb923c', '#60a5fa'];

/* ---------- 品牌 chips ---------- */
const brandChipEls = new Map();
function renderChips() {
  const el = $('chips'); el.innerHTML = '';
  DEFAULT_BRANDS.forEach(b => {
    const chip = document.createElement('span');
    chip.className = 'chip'; chip.dataset.brand = b;
    chip.innerHTML = `${b} <span class="x">×</span>`;
    chip.onclick = () => { selected.has(b) ? selected.delete(b) : (selected.add(b), $('custom-input').value = ''); chip.classList.toggle('off', !selected.has(b)); };
    el.appendChild(chip);
  });
}
$('add-btn').onclick = () => {
  const v = $('custom-input').value.trim();
  if (!v || selected.has(v)) return;
  selected.add(v); $('custom-input').value = '';
  const chip = document.createElement('span');
  chip.className = 'chip'; chip.dataset.brand = v;
  chip.innerHTML = `${v} <span class="x">×</span>`;
  chip.onclick = () => { selected.delete(v); chip.remove(); };
  $('chips').appendChild(chip);
};
$('custom-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('add-btn').click(); });

/* ---------- 侧边栏切换 ---------- */
document.querySelectorAll('.menu-item').forEach(item => {
  item.onclick = () => {
    document.querySelectorAll('.menu-item').forEach(x => x.classList.remove('active'));
    item.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('show'));
    $('view-' + item.dataset.view).classList.add('show');
    Object.values(charts).forEach(c => c && c.resize());
  };
});

/* ---------- 生成 ---------- */
$('generate-btn').onclick = generate;

function showLoading(on) {
  $('loading').style.display = on ? 'inline-block' : 'none';
  $('generate-btn').disabled = on;
}
function err(msg) {
  $('insights').innerHTML = `<div class="insight insight-warning"><span class="tag">⚠ 出错了</span> ${msg}</div>`;
  $('gap-notes').innerHTML = '';
}

async function generate() {
  const brands = [...selected];
  if (!brands.length) { err('请至少选 1 个品牌'); return; }
  showLoading(true);
  try {
    const resp = await fetch('/api/competitor-report', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ brands, top_n: 20, include_insights: true }),
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      throw new Error(e.detail?.msg || ('HTTP ' + resp.status));
    }
    const data = await resp.json();
    if (!data.rows || !data.rows.length) {
      throw new Error('没有拿到数据。' + (data.warnings && data.warnings[0] ? data.warnings[0] : '请确认所选品牌已扫描过'));
    }
    reportData = data;
    renderAll(data);
  } catch (e) { err(e.message); }
  finally { showLoading(false); }
}

/* ---------- 渲染 ---------- */
function fmtWan(n) {
  if (n == null) return '—';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}

function renderAll(data) {
  const rows = data.rows || [];
  const brands = rows.map(r => r.brand);

  // KPI
  const totalSample = rows.reduce((s, r) => s + (r.sample_size || 0), 0);
  const totalSales = rows.reduce((s, r) => s + (r.top_sales || 0), 0);
  const medians = rows.map(r => r.median).filter(v => v != null);
  const medianAvg = medians.length ? Math.round(medians.reduce((a, b) => a + b, 0) / medians.length) : null;
  const topBrand = rows.slice().sort((a, b) => (b.top_sales || 0) - (a.top_sales || 0))[0];
  const lowBrand = rows.slice().sort((a, b) => (a.median || 1e9) - (b.median || 1e9))[0];

  $('kpis').innerHTML = [
    { k: '对比品牌数', v: rows.length, trend: '' },
    { k: '商品样本总数', v: totalSample.toLocaleString(), trend: '' },
    { k: '均价中位数(¥)', v: medianAvg ?? '—', trend: '' },
    { k: '累计单品销量', v: fmtWan(totalSales), trend: `价格最低: ${lowBrand ? lowBrand.brand : '—'}` },
  ].map(x => `<div class="kpi"><div class="v">${x.v}</div><div class="k">${x.k}</div><div class="trend">${x.trend}</div></div>`).join('');

  // 图表
  renderPriceChart(brands, rows);
  renderSalesChart(brands, rows);
  renderDonut(brands, rows);
  renderInsights(data.insights, data.warnings);
  renderGapNotes(data.insights);
  renderBucket(brands, rows);
  renderRange(brands, rows);
  renderKeywordBar(brands, rows);
  renderWordcloud(brands, rows);
  renderTable(brands, rows);
}

function renderPriceChart(brands, rows) {
  const chart = initChart('chart-price');
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 46, right: 16, top: 22, bottom: 30 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: brands, axisLine: { lineStyle: { color: '#2a4a6a' } }, axisLabel: { color: '#cfe3f5', interval: 0, fontSize: 12 } },
    yAxis: { type: 'value', axisLabel: { color: '#7f9cc0' }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
    series: [{
      type: 'bar', data: rows.map(r => r.median),
      barWidth: '46%',
      itemStyle: {
        borderRadius: [6, 6, 0, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: '#00eaff' }, { offset: 1, color: '#0a4a8a' }]),
      },
      label: { show: true, position: 'top', color: '#cfe3f5', formatter: p => '¥' + p.value },
    }],
  });
}

function renderSalesChart(brands, rows) {
  const chart = initChart('chart-sales');
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 56, right: 20, top: 22, bottom: 30 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: brands, axisLine: { lineStyle: { color: '#2a4a6a' } }, axisLabel: { color: '#cfe3f5', interval: 0, fontSize: 12 } },
    yAxis: { type: 'value', axisLabel: { color: '#7f9cc0', formatter: v => fmtWan(v) }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
    series: [{
      type: 'line', data: rows.map(r => r.top_sales || 0), smooth: true, symbol: 'circle', symbolSize: 8,
      lineStyle: { width: 3, color: '#f5c518' }, itemStyle: { color: '#f5c518' },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(245,197,24,.35)' }, { offset: 1, color: 'rgba(245,197,24,0)' }]),
      },
      label: { show: true, position: 'top', color: '#f5c518', formatter: p => fmtWan(p.value) },
    }],
  });
}

function renderDonut(brands, rows) {
  const chart = initChart('chart-donut');
  chart.setOption({
    backgroundColor: 'transparent',
    color: COLORS,
    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
    legend: { bottom: 0, textStyle: { color: '#cfe3f5' }, itemWidth: 12, itemHeight: 12, type: 'scroll' },
    series: [{
      type: 'pie', radius: ['42%', '66%'], center: ['50%', '46%'],
      data: rows.map(r => ({ name: r.brand, value: r.top_sales || 0 })),
      label: { color: '#cfe3f5', formatter: '{b}\n{d}%' },
      itemStyle: { borderColor: '#0a1628', borderWidth: 2 },
    }],
  });
}

function renderInsights(insights, warnings) {
  const el = $('insights'); el.innerHTML = '';
  const kindTag = { tier: '梯队', hot: '热度', gap: '空缺', warning: '数据' };
  (insights || []).forEach(i => {
    const div = document.createElement('div');
    div.className = 'insight insight-' + (i.kind || 'tier');
    div.innerHTML = `<span class="tag">${kindTag[i.kind] || i.kind}</span> <span>${i.body}</span>`;
    el.appendChild(div);
  });
  (warnings || []).forEach(w => {
    const div = document.createElement('div');
    div.className = 'insight insight-warning';
    div.innerHTML = `<span class="tag">说明</span> <span>${w}</span>`;
    el.appendChild(div);
  });
  if (!el.children.length) el.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">暂无洞察</div>';
}

function renderGapNotes(insights) {
  const el = $('gap-notes');
  const gap = (insights || []).filter(i => i.kind === 'gap');
  el.innerHTML = gap.length ? gap.map(g => '<div style="margin-bottom:10px;line-height:1.6;color:var(--text);font-size:13px;">💡 ' + g.body + '</div>').join('') : '<span style="font-size:13px;">无空缺机会洞察</span>';
}

/* 价格分档堆叠柱 */
function renderBucket(brands, rows) {
  const chart = initChart('chart-bucket');
  const keys = [['bucket_under_100', '¥100以内'], ['bucket_100_300', '¥100-300'], ['bucket_300_800', '¥300-800'], ['bucket_over_800', '¥800+']];
  const palette = ['#00eaff', '#38bdf8', '#f5c518', '#f472b6'];
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 46, right: 20, top: 40, bottom: 30 },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    legend: { top: 0, textStyle: { color: '#cfe3f5' } },
    xAxis: { type: 'category', data: brands, axisLine: { lineStyle: { color: '#2a4a6a' } }, axisLabel: { color: '#cfe3f5', interval: 0, fontSize: 12 } },
    yAxis: { type: 'value', axisLabel: { color: '#7f9cc0' }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
    series: keys.map(([k, name], i) => ({
      name, type: 'bar', stack: 'total', barWidth: '46%',
      data: rows.map(r => r[k] || 0), itemStyle: { color: palette[i] },
    })),
  });
}

/* 价格区间(箱线近似 → 用 min/median/max 条形) */
function renderRange(brands, rows) {
  const chart = initChart('chart-range');
  // 用 min / max 画范围, median 画点
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 46, right: 20, top: 30, bottom: 30 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: brands, axisLine: { lineStyle: { color: '#2a4a6a' } }, axisLabel: { color: '#cfe3f5', interval: 0, fontSize: 12 } },
    yAxis: { type: 'value', axisLabel: { color: '#7f9cc0' }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
    series: [
      { type: 'bar', name: '价格区间', barWidth: '40%', data: rows.map(r => r.max || 0), itemStyle: { color: 'rgba(56,189,248,.25)', borderRadius: [4,4,0,0] } },
      { type: 'bar', name: '最小值', barWidth: '40%', data: rows.map(r => r.min || 0), itemStyle: { color: 'rgba(0,224,255,.5)' } },
      { type: 'scatter', name: '中位数', symbolSize: 10, data: rows.map(r => r.median || 0), itemStyle: { color: '#f5c518' } },
    ],
  });
}

/* 卖点横向柱 */
function renderKeywordBar(brands, rows) {
  const chart = initChart('chart-keywords');
  const agg = {};
  rows.forEach(r => (r.top_keywords || []).forEach(k => { agg[k.keyword] = (agg[k.keyword] || 0) + (k.count || 0); }));
  const items = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 10);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 70, right: 20, top: 10, bottom: 20 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'value', axisLabel: { color: '#7f9cc0' }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
    yAxis: { type: 'category', data: items.map(i => i[0]).reverse(), axisLabel: { color: '#cfe3f5' }, axisLine: { lineStyle: { color: '#2a4a6a' } } },
    series: [{
      type: 'bar', data: items.map(i => i[1]).reverse(), barWidth: '55%',
      itemStyle: { borderRadius: [0,6,6,0], color: new echarts.graphic.LinearGradient(1, 0, 0, 0, [
        { offset: 0, color: '#00eaff' }, { offset: 1, color: '#38bdf8' }]) },
      label: { show: true, position: 'right', color: '#cfe3f5' },
    }],
  });
}

/* 词云 */
function renderWordcloud(brands, rows) {
  const chart = initChart('chart-wordcloud');
  const agg = {};
  rows.forEach(r => (r.top_keywords || []).forEach(k => { agg[k.keyword] = (agg[k.keyword] || 0) + (k.count || 0); }));
  const data = Object.entries(agg).map(([name, value]) => ({ name, value }));
  if (!data.length) { chart.clear(); return; }
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { formatter: p => p.name + ': ' + p.value + ' 次' },
    series: [{
      type: 'wordCloud', shape: 'circle', gridSize: 12, sizeRange: [14, 60], rotationRange: [0, 0],
      textStyle: { color: () => COLORS[Math.floor(Math.random() * COLORS.length)] },
      emphasis: { textStyle: { shadowBlur: 10, shadowColor: '#00eaff' } },
      data,
    }],
  });
}

/* 表格 */
function renderTable(brands, rows) {
  const head = ['品牌', '中位价', '价格区间', '价格分档(低/中/高/顶)', '高频卖点', '销量冠军', '单品销量'];
  $('table-head').innerHTML = head.map(h => `<th>${h}</th>`).join('');
  const low = ['¥100以内', '¥100-300', '¥300-800', '¥800+'];
  $('table-body').innerHTML = rows.map(r => {
    const buckets = [r.bucket_under_100 || 0, r.bucket_100_300 || 0, r.bucket_300_800 || 0, r.bucket_over_800 || 0];
    const max = Math.max(...buckets) || 1;
    const bars = buckets.map((b, i) => {
      const pct = Math.round(b / max * 100);
      return `<div style="margin:2px 0;"><span style="font-size:11px;color:#7f9cc0;">${low[i]}</span>
        <div class="bar-mini" style="width:${pct}%;background:${COLORS[i % COLORS.length]};"></div>
        <span style="font-size:11px;color:#cfe3f5;"> ${b}</span></div>`;
    }).join('');
    const kws = (r.top_keywords || []).slice(0, 3).map(k => k.keyword).join(' / ');
    return `<tr><td style="font-weight:600;color:var(--cyan);">${r.brand}</td>
      <td>¥${r.median ?? '—'}</td><td>¥${r.min ?? '—'} ~ ¥${r.max ?? '—'}</td>
      <td>${bars}</td><td>${kws || '—'}</td>
      <td>${(r.top_product || '—').slice(0, 16)}${(r.top_product||'').length > 16 ? '…' : ''}</td>
      <td>${fmtWan(r.top_sales)}</td></tr>`;
  }).join('');
}

/* ECharts 实例管理 */
function initChart(id) {
  if (!charts[id]) charts[id] = echarts.init(document.getElementById(id));
  return charts[id];
}

/* 时钟 */
function tick() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  $('clock').textContent = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

window.addEventListener('resize', () => Object.values(charts).forEach(c => c && c.resize()));

renderChips();
tick(); setInterval(tick, 1000);
generate();
</script>
</body>
</html>
