  <title>拼多多竞品调研 · 数据大屏</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css" data-page-node-id="ZIJDI58mz8Ju3C3ck654sS">
  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/vendor/echarts-wordcloud.min.js"></script>
  <style>
    :root {
      --bg-0: #070d1a;
      --bg-1: #0a1628;
      --bg-2: #0d1b2e;
      --panel: rgba(13, 42, 80, .55);
      --panel-solid: #0c2038;
      --line: rgba(0, 224, 255, .18);
      --line-strong: rgba(0, 224, 255, .45);
      --cyan: #00eaff;
      --cyan-dim: #22d3ee;
      --blue: #38bdf8;
      --text: #cfe3f5;
      --text-dim: #7f9cc0;
      --gold: #f5c518;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: radial-gradient(1200px 600px at 20% -10%, #0d2a4d 0%, var(--bg-0) 60%), var(--bg-1);
      color: var(--text); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      overflow-x: hidden;
    }
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

    /* ---------- 侧边栏 ---------- */
    .sidebar {
      background: linear-gradient(180deg, #081020, #0a1628);
      border-right: 1px solid var(--line); padding: 18px 0;
      position: sticky; top: 0; height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 8px 20px 20px; }
    .brand .logo {
      width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #04121f; font-weight: 800; font-size: 18px;
      box-shadow: 0 0 16px rgba(0, 224, 255, .5);
    }
    .brand .name { font-weight: 700; font-size: 15px; letter-spacing: .5px; }
    .brand .sub { font-size: 11px; color: var(--text-dim); }
    .menu { margin-top: 6px; }
    .menu-item {
      display: flex; align-items: center; gap: 10px; padding: 12px 20px; cursor: pointer;
      color: var(--text-dim); font-size: 14px; border-left: 3px solid transparent; transition: .15s;
    }
    .menu-item:hover { color: var(--text); background: rgba(0,224,255,.06); }
    .menu-item.active { color: var(--cyan); background: rgba(0,224,255,.1); border-left-color: var(--cyan); }
    .menu-item .ico { width: 18px; text-align: center; }

    /* ---------- 主区 ---------- */
    .main { padding: 16px 22px 40px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .topbar .title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .topbar .title .hl { color: var(--cyan); }
    .topbar .time { font-size: 12px; color: var(--text-dim); }

    /* ---------- 条件面板 ---------- */
    .ctrl {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 16px 18px; margin-bottom: 18px; backdrop-filter: blur(4px);
    }
    .ctrl .lbl { font-size: 13px; color: var(--cyan-dim); margin-bottom: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 16px;
      background: rgba(0,224,255,.1); border: 1px solid rgba(0,224,255,.3); color: var(--cyan); cursor: pointer; font-size: 13px;
    }
    .chip.off { background: rgba(120,150,180,.08); border-color: rgba(120,150,180,.2); color: #8aa0b8; }
    .chip .x { opacity: .6; }
    .c-input {
      background: rgba(0,0,0,.25); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 6px 12px; width: 140px; font-size: 13px;
    }
    .c-input:focus { outline: none; border-color: var(--cyan); }
    .btn-glow {
      background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #04121f; font-weight: 700;
      border: none; border-radius: 8px; padding: 9px 22px; font-size: 14px;
      box-shadow: 0 0 18px rgba(0,224,255,.45); cursor: pointer; transition: .15s;
    }
    .btn-glow:hover { transform: translateY(-1px); box-shadow: 0 0 24px rgba(0,224,255,.7); }
    .btn-glow:disabled { opacity: .5; cursor: not-allowed; }

    /* ---------- KPI ---------- */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
    .kpi {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px;
      position: relative; overflow: hidden;
    }
    .kpi::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, transparent, rgba(0,224,255,.06)); }
    .kpi .v { font-size: 30px; font-weight: 800; color: var(--cyan); letter-spacing: .5px; }
    .kpi .k { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
    .kpi .trend { font-size: 12px; margin-top: 6px; color: var(--gold); }

    /* ---------- 网格面板 ---------- */
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
      position: relative;
    }
    .panel .h5 { font-size: 14px; color: var(--cyan-dim); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .panel .h5 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .chart { width: 100%; height: 260px; }
    .chart.tall { height: 300px; }

    /* ---------- 洞察 ---------- */
    .insight { border-left: 3px solid; padding: 8px 12px; margin-bottom: 10px; background: rgba(0,0,0,.15); border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .insight-tier { border-color: var(--cyan); }
    .insight-hot { border-color: var(--gold); }
    .insight-gap { border-color: var(--blue); }
    .insight-warning { border-color: #f87171; }
    .insight .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(0,224,255,.15); color: var(--cyan); white-space: nowrap; }
    .insight-warning .tag { background: rgba(248,113,113,.15); color: #f87171; }
    .insight-hot .tag { background: rgba(245,197,24,.15); color: var(--gold); }

    /* ---------- 警告条 / 空态卡片 (Day 9: 失败要响, 不再静默空白) ---------- */
    .alert-bar { border: 1px solid rgba(245,197,24,.45); background: rgba(245,197,24,.10);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; color: #f5c518; }
    .alert-bar b { color: #ffd85e; }
    .alert-bar ul { margin: 6px 0 0; padding-left: 18px; }
    .alert-bar li { margin: 2px 0; }
    .empty-card { border: 1px solid rgba(248,113,113,.5); background: rgba(248,113,113,.08);
      border-radius: 10px; padding: 26px 22px; text-align: center; }
    .empty-card h4 { margin: 0 0 8px; color: #f87171; font-size: 16px; }
    .empty-card p { margin: 6px 0; color: var(--text-dim); font-size: 13px; }
    .empty-card code { background: rgba(0,0,0,.3); padding: 2px 6px; border-radius: 4px; color: var(--cyan); }

    /* ---------- Day 9 Phase 3: 扫描进度 ---------- */
    .scan-bar { border: 1px solid var(--line-strong); background: var(--panel);
      border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; }
    .scan-bar .hd { display: flex; justify-content: space-between; gap: 12px; color: var(--cyan); }
    .scan-bar .hd .kw { color: var(--text-dim); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scan-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); margin: 9px 0 6px; overflow: hidden; }
    .scan-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--blue)); transition: width .4s; }
    .scan-log { margin: 8px 0 0; padding: 8px 10px; max-height: 108px; overflow: auto;
      background: rgba(0,0,0,.35); border-radius: 6px; font-family: Consolas, Menlo, monospace;
      font-size: 11px; line-height: 1.55; color: var(--text-dim); white-space: pre-wrap; word-break: break-all; }
    .scan-fail { border: 1px solid rgba(248,113,113,.5); background: rgba(248,113,113,.08);
      border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; color: #f87171; }
    .scan-fail b { color: #fca5a5; }
    .scan-fail code { background: rgba(0,0,0,.3); padding: 2px 6px; border-radius: 4px; color: var(--cyan); }
    .scan-ok { border: 1px solid rgba(52,211,153,.45); background: rgba(52,211,153,.10);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; color: #34d399; }

    /* ---------- 表格 ---------- */
    .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    /* table-layout:fixed + <colgroup> —— 列宽由我们定, 不再被长内容撑宽/把邻居挤到换行 */
    table.data { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
    table.data th, table.data td {
      padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(120,150,180,.12);
      overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
    }
    /* 文本列 nowrap —— "¥82 ~ ¥949" / "5000万" 这类不该被折成两行 */
    table.data th, table.data td.nowrap { white-space: nowrap; }
    table.data th { color: var(--cyan-dim); font-weight: 600; }
    /* 2 级表头的子列头 (¥100以内 / ¥100-300 / ...) */
    table.data th.sub { font-size: 11px; font-weight: 400; color: #7f9cc0; text-align: center; }
    table.data thead tr:first-child th { border-bottom: 1px solid var(--line); }
    table.data tbody tr:hover { background: rgba(0,224,255,.05); }
    .bar-mini { display: inline-block; height: 7px; border-radius: 3px; background: linear-gradient(90deg, var(--cyan), var(--blue)); }

    /* 价格分档: 每个价位段独立成一列, bar 横向铺满 (原为 1 个 td 里纵向堆 4 个 div → 行高 ×4) */
    td.pd-cell { padding: 6px 7px !important; white-space: nowrap; }
    .pd-val { font-size: 12px; font-weight: 600; color: #cfe3f5; line-height: 1.15; }
    .pd-bar { height: 5px; border-radius: 3px; margin-top: 3px; min-width: 2px; transition: width .2s; }

    /* 四角发光角标 */
    .corner { position: absolute; width: 14px; height: 14px; border-color: var(--line-strong); border-style: solid; }
    .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .loading-ring { width: 22px; height: 22px; border: 3px solid rgba(0,224,255,.25); border-top-color: var(--cyan); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 26px; }
    .view { display: none; }
    .view.show { display: block; }
  </style>

<script>
const DEFAULT_BRANDS = ['华为', '小米', '倍思', 'QCY', '万魔', '漫步者'];
let selected = new Set(DEFAULT_BRANDS);
const charts = {};
let reportData = null;

const $ = id => document.getElementById(id);
const COLORS = ['#00eaff', '#38bdf8', '#a78bfa', '#f5c518', '#f472b6', '#34d399', '#fb923c', '#60a5fa'];

/* ---------- 品牌 chips ---------- */
const brandChipEls = new Map();
function renderChips() {
  const el = $('chips'); el.innerHTML = '';
  DEFAULT_BRANDS.forEach(b => {
    const chip = document.createElement('span');
    chip.className = 'chip'; chip.dataset.brand = b;
    chip.innerHTML = `${b} <span class="x">×</span>`;
    chip.onclick = () => { selected.has(b) ? selected.delete(b) : (selected.add(b), $('custom-input').value = ''); chip.classList.toggle('off', !selected.has(b)); };
    el.appendChild(chip);
  });
}
$('add-btn').onclick = () => {
  const v = $('custom-input').value.trim();
  if (!v || selected.has(v)) return;
  selected.add(v); $('custom-input').value = '';
  const chip = document.createElement('span');
  chip.className = 'chip'; chip.dataset.brand = v;
  chip.innerHTML = `${v} <span class="x">×</span>`;
  chip.onclick = () => { selected.delete(v); chip.remove(); };
  $('chips').appendChild(chip);
};
$('custom-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('add-btn').click(); });

/* ---------- 侧边栏切换 ---------- */
document.querySelectorAll('.menu-item').forEach(item => {
  item.onclick = () => {
    document.querySelectorAll('.menu-item').forEach(x => x.classList.remove('active'));
    item.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('show'));
    $('view-' + item.dataset.view).classList.add('show');
    Object.values(charts).forEach(c => c && c.resize());
  };
});

/* ---------- 生成 ---------- */
$('generate-btn').onclick = generate;

function showLoading(on) {
  $('loading').style.display = on ? 'inline-block' : 'none';
  $('generate-btn').disabled = on;
}
function err(msg) {
  $('insights').innerHTML = `<div class="insight insight-warning"><span class="tag">⚠ 出错了</span> ${msg}</div>`;
  $('gap-notes').innerHTML = '';
}

/* ---------- Day 9: 失败要响 ---------- */
/* 部分品牌无数据 → 报告顶部黄色警告条, 别让用户以为数据是完整的 */
function renderAlert(warnings) {
  const el = $('alert-zone');
  if (!warnings || !warnings.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="alert-bar">
    <b>⚠ 部分数据缺失</b> (${warnings.length} 条) — 以下关键词没有缓存数据, 报告中已跳过:
    <ul>${warnings.map(w => `<li>${w}</li>`).join('')}</ul>
  </div>`;
}

/* 全部无数据 → 显式空态卡片 (含"缓存里现在有什么" + 怎么扫), 不再是空白四视图 */
async function renderEmpty(requested, warnings) {
  document.querySelectorAll('.view').forEach(v => { v.style.display = 'none'; });
  // 空态卡片已包含全部原因, 顶部警告条会重复 → 清掉
  $('alert-zone').innerHTML = '';
  const el = $('empty-zone');
  el.innerHTML = `<div class="empty-card">
    <h4>没有可展示的数据</h4>
    <p>请求的关键词: <b style="color:var(--cyan);">${requested.join('、')}</b></p>
    <p style="text-align:left;margin-top:12px;">${(warnings || []).map(w => '· ' + w).join('<br/>') || '· 原因未知'}</p>
    <p style="margin-top:14px;">这些关键词需要先扫描才有数据。缓存里现有的关键词:
      <span id="cached-kws" style="color:var(--cyan);">加载中…</span></p>
    <p style="margin-top:10px;">扫描方式: 先跑 <code>scripts/start_pdd_cdp_chrome.ps1</code>
      起 Chrome 并登录拼多多, 再执行<br/>
      <code>.venv\\Scripts\\python.exe scripts\\ecommerce_brand_compare.py --brands ${requested.slice(0, 3).join(' ')}</code></p>
  </div>`;
  // 拉缓存清单, 告诉用户"现在能查什么"
  try {
    const r = await fetch('/api/cache-status');
    const d = await r.json();
    const kw = (d.keywords || []).join('、') || '（空）';
    const span = document.getElementById('cached-kws');
    if (span) span.textContent = kw;
  } catch (e) {
    const span = document.getElementById('cached-kws');
    if (span) span.textContent = '（读取失败）';
  }
}

function clearEmpty() {
  $('empty-zone').innerHTML = '';
  document.querySelectorAll('.view').forEach(v => { v.style.display = ''; });
  Object.values(charts).forEach(c => c && c.resize());
}

async function generate() {
  const brands = [...selected];
  if (!brands.length) { err('请至少选 1 个品牌'); return; }
  showLoading(true);
  try {
    const resp = await fetch('/api/competitor-report', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ brands, top_n: 20, include_insights: true }),
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      throw new Error(e.detail?.msg || ('HTTP ' + resp.status));
    }
    const data = await resp.json();
    reportData = data;
    renderAlert(data.warnings);
    if (!data.rows || !data.rows.length) {
      // Day 9: 不 throw —— 渲染显式空态卡片, 告诉用户缺什么 + 怎么补
      await renderEmpty(brands, data.warnings);
      $('insights').innerHTML = '';
      $('gap-notes').innerHTML = '';
      return;
    }
    clearEmpty();
    renderAll(data);
  } catch (e) { err(e.message); }
  finally { showLoading(false); }
}

/* ---------- Day 9 Phase 3: 一键「扫描并生成」 ---------- */
/* 扫描在后端子进程里跑 (真实页面 30~60s), 前端只 2s 轮询状态:
   不占住页面、不超时、失败也要把原因说清楚 (B-53 错误带 how_to_fix) */
let scanTimer = null;
let scanPolls = 0;
const SCAN_MAX_POLLS = 300;   // 10 分钟硬上限: 脚本挂死也不能让用户无限等

/* 关键词本身已含品类时不能再拼后缀, 否则会出现 "蓝牙音箱蓝牙耳机" 这种串味关键词 */
const DEFAULT_SUFFIX = '蓝牙耳机';
const hasCategory = (kw) => /耳机|耳麦|音箱|充电|数据线|手机壳/.test(kw);

function appendCustomChip(v) {
  if (!v || selected.has(v)) return;
  selected.add(v);
  const chip = document.createElement('span');
  chip.className = 'chip'; chip.dataset.brand = v;
  chip.innerHTML = `${v} <span class="x">×</span>`;
  chip.onclick = () => { selected.delete(v); chip.remove(); };
  $('chips').appendChild(chip);
}

const esc = (s) => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

function renderScan(s) {
  const kws = s.keywords || [];
  const done = (s.succeeded || []).length + (s.failed || []).length;
  const pct = kws.length ? Math.min(100, Math.round(done / kws.length * 100)) : 0;
  const log = (s.log_tail || []).slice(-4).map(esc).join('\n');
  $('scan-zone').innerHTML = `<div class="scan-bar">
    <div class="hd"><span>📡 正在扫描 ${done}/${kws.length}</span><span class="kw">${esc(s.current || '启动中…')}</span></div>
    <div class="scan-track"><div class="scan-fill" style="width:${pct}%"></div></div>
    <div style="color:var(--text-dim);">成功 ${(s.succeeded || []).length} · 失败 ${(s.failed || []).length} —— 扫描真实页面需要 30~60 秒</div>
    ${log ? `<pre class="scan-log">${log}</pre>` : ''}
  </div>`;
}

function renderScanDone(s) {
  const ok = s.succeeded || [], bad = s.failed || [];
  // 0 商品通常不是"真没数据", 是登录态失效 (见 ecommerce_scan._parse_log 注释)
  const needLogin = bad.some(f => /登录|0 个商品/.test(f.reason || ''));
  $('scan-zone').innerHTML = `<div class="${ok.length ? 'scan-ok' : 'scan-fail'}">
    <b>${ok.length ? '✓ 扫描完成' : '✗ 扫描失败'}</b>
    ${ok.length ? ` 已拿到数据: <b style="color:var(--cyan);">${ok.map(esc).join('、')}</b>, 正在生成报告…` : ''}
    ${bad.length ? `<div style="margin-top:6px;">失败 ${bad.length} 个: ${bad.map(f => esc(f.keyword) + ' — ' + esc(f.reason)).join('；')}</div>` : ''}
    ${needLogin ? `<div style="margin-top:8px;">拼多多登录态可能失效: 在 CDP Chrome 里重新扫码登录后重试。
      或先跑 <code>scripts/start_pdd_cdp_chrome.ps1</code> 确认 Chrome 已启动 (端口 9223)。</div>` : ''}
  </div>`;
}

function stopScan(msg) {
  clearInterval(scanTimer); scanTimer = null;
  $('scan-btn').disabled = false; $('generate-btn').disabled = false;
  if (msg) $('scan-zone').innerHTML = `<div class="scan-fail"><b>✗ ${esc(msg)}</b></div>`;
}

async function scanAndGenerate() {
  const kw = ($('custom-input').value || '').trim();
  if (!kw) {
    $('scan-zone').innerHTML = `<div class="scan-fail"><b>✗ 先在输入框填品牌名</b> (如 OPPO), 再点「扫描并生成」</div>`;
    $('custom-input').focus();
    return;
  }
  $('scan-btn').disabled = true; $('generate-btn').disabled = true;
  $('scan-zone').innerHTML = `<div class="scan-bar"><div class="hd"><span>📡 正在启动扫描…</span></div></div>`;
  try {
    const resp = await fetch('/api/scan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keywords: [kw], suffix: hasCategory(kw) ? '' : DEFAULT_SUFFIX }),
    });
    if (resp.status === 503) {
      const d = await resp.json().catch(() => ({}));
      const detail = d.detail || {};
      $('scan-zone').innerHTML = `<div class="scan-fail">
        <b>✗ 连不上本机 Chrome (CDP 9223)</b><br/>${esc(detail.msg || '')}
        <div style="margin-top:8px;">${esc(detail.how_to_fix || '启动 CDP Chrome 并登录拼多多')}</div></div>`;
      stopScan(); return;
    }
    if (resp.status === 409) { stopScan('已有扫描任务在跑, 等它结束再试'); return; }
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      stopScan(d.detail?.msg || ('HTTP ' + resp.status)); return;
    }
    scanPolls = 0;
    scanTimer = setInterval(pollScan, 2000);
    pollScan();   // 立刻拉一次, 别让用户干等第一个 2 秒
  } catch (e) { stopScan(e.message); }
}

async function pollScan() {
  if (++scanPolls > SCAN_MAX_POLLS) { stopScan('扫描超时 (10 分钟), 请检查脚本是否卡住'); return; }
  let s;
  try {
    const r = await fetch('/api/scan/status');
    s = await r.json();
  } catch (e) { return; }   // 单次网络抖动不终止轮询
  if (!s || s.status === 'idle') return;
  if (s.status === 'running') { renderScan(s); return; }
  clearInterval(scanTimer); scanTimer = null;
  $('scan-btn').disabled = false; $('generate-btn').disabled = false;
  renderScanDone(s);
  (s.succeeded || []).forEach(appendCustomChip);
  $('custom-input').value = '';
  if ((s.succeeded || []).length) generate();
}
$('scan-btn').onclick = scanAndGenerate;

/* ---------- 渲染 ---------- */
function fmtWan(n) {
  if (n == null) return '—';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}

// ── 销量口径 ────────────────────────────────────────────────────────────
// top_sales 有两种完全不同的语义, 由后端 top_sales_source 标识:
//   'single'     → 详情页单品销量 (可跨品牌比)
//   'shop_total' → 列表页店铺/品牌累计 (不可当单品比)
// 前端绝不能脱离口径直接显示成一个"单品销量"标签 —— 那会把 4000万累计说成单品卖了4000万。
const SALES_LABEL = { single: '单品销量', shop_total: '店铺/品牌累计销量', unknown: '销量' };
const salesLabel = (src) => SALES_LABEL[src] || SALES_LABEL.unknown;

// 混口径检测: 有的品牌有单品销量、有的只有累计数 → 放同一张图比是误导, 必须提示
function salesSourceStats(rows) {
  const sources = new Set(rows.filter(r => r.top_sales != null).map(r => r.top_sales_source || 'unknown'));
  return { mixed: sources.size > 1, sources: [...sources], dominant: [...sources][0] || 'unknown' };
}

function renderAll(data) {
  // 报告已经渲染出来了 → 清掉"正在生成报告"的临时成功条 (失败条要留着给用户看原因)
  const sz = document.getElementById('scan-zone');
  if (sz && sz.querySelector('.scan-ok')) sz.innerHTML = '';
  const rows = data.rows || [];
  const brands = rows.map(r => r.brand);
  const sStat = salesSourceStats(rows);

  // KPI —— 销量合计只能加同口径的数; 混口径时只合计"可比组"(单品销量), 店铺累计不入和
  const totalSample = rows.reduce((s, r) => s + (r.sample_size || 0), 0);
  const comparableRows = rows.filter(r => (r.top_sales_source || 'unknown') === 'single');
  const excludedRows = rows.filter(r => (r.top_sales_source || 'unknown') !== 'single' && r.top_sales != null);
  const totalSales = comparableRows.reduce((s, r) => s + (r.top_sales || 0), 0);
  const medians = rows.map(r => r.median).filter(v => v != null);
  const medianAvg = medians.length ? Math.round(medians.reduce((a, b) => a + b, 0) / medians.length) : null;
  const lowBrand = rows.slice().sort((a, b) => (a.median || 1e9) - (b.median || 1e9))[0];

  $('kpis').innerHTML = [
    { k: '对比品牌数', v: rows.length, trend: '' },
    { k: '商品样本总数', v: totalSample.toLocaleString(), trend: '' },
    { k: '均价中位数(¥)', v: medianAvg ?? '—', trend: `价格最低: ${lowBrand ? lowBrand.brand : '—'}` },
    {
      k: sStat.mixed ? '单品销量合计 (可比组)' : `销量合计 (${salesLabel(sStat.dominant)})`,
      v: fmtWan(totalSales),
      trend: sStat.mixed
        ? `⚠ 另 ${excludedRows.length} 个品牌仅店铺累计, 未计入`
        : '',
    },
  ].map(x => `<div class="kpi"><div class="v">${x.v}</div><div class="k">${x.k}</div><div class="trend">${x.trend}</div></div>`).join('');

  // 图表标题随口径变 + 混口径时挂警告条
  const comparableCnt = rows.filter(r => (r.top_sales_source || 'unknown') === 'single').length;
  const excludedCnt = rows.filter(r => (r.top_sales_source || 'unknown') !== 'single' && r.top_sales != null).length;
  const salesTitle = sStat.mixed
    ? '各品牌销量 (⚠ 仅可比组连线, 店铺累计另列虚线, 不可混比)'
    : `各品牌${salesLabel(sStat.dominant)} (件)`;
  const ts = document.getElementById('title-sales');
  const td = document.getElementById('title-donut');
  if (ts) ts.textContent = salesTitle;
  // 混口径时占比只在可比组(单品)里算; 店铺累计被剔除, 分母才干净
  if (td) {
    td.textContent = sStat.mixed
      ? `单品销量占比 · 可比组 ${comparableCnt} 个${excludedCnt ? ` (已排除 ${excludedCnt} 个店铺累计品牌)` : ''}`
      : `${salesLabel(sStat.dominant)}占比`;
  }

  // 图表
  renderPriceChart(brands, rows);
  renderSalesChart(brands, rows);
  renderDonut(brands, rows);
  renderInsights(data.insights, data.warnings);
  renderGapNotes(data.insights);
  renderBucket(brands, rows);
  renderRange(brands, rows);
  renderKeywordBar(brands, rows);
  renderWordcloud(brands, rows);
  renderTable(brands, rows);
}

function renderPriceChart(brands, rows) {
  const chart = initChart('chart-price');
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 46, right: 16, top: 22, bottom: 30 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: brands, axisLine: { lineStyle: { color: '#2a4a6a' } }, axisLabel: { color: '#cfe3f5', interval: 0, fontSize: 12 } },
    yAxis: { type: 'value', axisLabel: { color: '#7f9cc0' }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
    series: [{
      type: 'bar', data: rows.map(r => r.median),
      barWidth: '46%',
      itemStyle: {
        borderRadius: [6, 6, 0, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: '#00eaff' }, { offset: 1, color: '#0a4a8a' }]),
      },
      label: { show: true, position: 'top', color: '#cfe3f5', formatter: p => '¥' + p.value },
    }],
  });
}

function renderSalesChart(brands, rows) {
  const chart = initChart('chart-sales');
  const sStat = salesSourceStats(rows);

  // 混口径时不能连线: 一条折线把"5万单品"和"1700万店铺累计"连起来,
  // 视觉上就在暗示它们同量级同语义 —— 用户第一眼就会得出"OPPO 销量碾压"的假结论。
  // 拆成两条独立折线 (单品 / 店铺累计), 各自一条线, 中间不连, 图例说明口径。
  if (sStat.mixed) {
    const single = rows.filter(r => (r.top_sales_source || 'unknown') === 'single' && r.top_sales != null);
    const shop = rows.filter(r => (r.top_sales_source || 'unknown') === 'shop_total' && r.top_sales != null);
    const allBrands = rows.map(r => r.brand);
    chart.setOption({
      backgroundColor: 'transparent',
      grid: { left: 56, right: 20, top: 30, bottom: 34 },
      tooltip: {
        trigger: 'axis',
        formatter: (ps) => {
          const b = ps[0].axisValue;
          const r = rows.find(x => x.brand === b) || {};
          const src = r.top_sales_source || 'unknown';
          const warn = src === 'shop_total' ? '<br/><span style="color:#ffb020">⚠ 店铺/品牌累计, 非单品销量</span>' : '';
          return `${b}<br/>${salesLabel(src)}: <b>${fmtWan(r.top_sales || 0)}</b>${warn}`;
        },
      },
      xAxis: { type: 'category', data: allBrands, axisLine: { lineStyle: { color: '#2a4a6a' } }, axisLabel: { color: '#cfe3f5', interval: 0, fontSize: 12 } },
      yAxis: { type: 'value', axisLabel: { color: '#7f9cc0', formatter: v => fmtWan(v) }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
      legend: { top: 0, textStyle: { color: '#cfe3f5', fontSize: 11 }, itemWidth: 14, itemHeight: 10,
        data: [{ name: '单品销量', itemStyle: { color: '#00eaff' } }, { name: '店铺/品牌累计 (参考)', itemStyle: { color: '#ffb020' } }] },
      series: [
        {
          name: '单品销量', type: 'line', smooth: false, connectNulls: false,
          symbol: 'circle', symbolSize: 9,
          data: allBrands.map(b => { const r = single.find(x => x.brand === b); return r ? r.top_sales : null; }),
          lineStyle: { width: 3, color: '#00eaff' }, itemStyle: { color: '#00eaff' },
          label: { show: true, position: 'top', color: '#00eaff', formatter: p => p.value == null ? '' : fmtWan(p.value) },
        },
        {
          name: '店铺/品牌累计 (参考)', type: 'line', smooth: false, connectNulls: false,
          symbol: 'diamond', symbolSize: 10,
          data: allBrands.map(b => { const r = shop.find(x => x.brand === b); return r ? r.top_sales : null; }),
          lineStyle: { width: 3, color: '#ffb020', type: 'dashed' }, itemStyle: { color: '#ffb020' },
          label: { show: true, position: 'top', color: '#ffb020', formatter: p => p.value == null ? '' : fmtWan(p.value) + '\n⚠累计' },
        },
      ],
    }, true);
    return;
  }

  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 56, right: 20, top: 22, bottom: 30 },
    // tooltip 里带口径, hover 时能看到这数字到底是单品还是店铺累计
    tooltip: {
      trigger: 'axis',
      formatter: (ps) => {
        const i = ps[0].dataIndex;
        const r = rows[i] || {};
        const src = r.top_sales_source || 'unknown';
        const warn = src === 'shop_total' ? '<br/><span style="color:#ffb020">⚠ 店铺/品牌累计, 非单品销量</span>' : '';
        return `${r.brand || brands[i]}<br/>${salesLabel(src)}: <b>${fmtWan(r.top_sales || 0)}</b>${warn}`;
      },
    },
    xAxis: { type: 'category', data: brands, axisLine: { lineStyle: { color: '#2a4a6a' } }, axisLabel: { color: '#cfe3f5', interval: 0, fontSize: 12 } },
    yAxis: { type: 'value', axisLabel: { color: '#7f9cc0', formatter: v => fmtWan(v) }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
    series: [{
      type: 'line', data: rows.map(r => r.top_sales || 0), smooth: true, symbol: 'circle', symbolSize: 8,
      lineStyle: { width: 3, color: '#f5c518' }, itemStyle: { color: '#f5c518' },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(245,197,24,.35)' }, { offset: 1, color: 'rgba(245,197,24,0)' }]),
      },
      label: { show: true, position: 'top', color: '#f5c518', formatter: p => fmtWan(p.value) },
    }],
  });
}

function renderDonut(brands, rows) {
  const chart = initChart('chart-donut');
  const sStat = salesSourceStats(rows);

  // 口径分层: 只把"单品销量"(single) 放同一分母 —— 它们语义一致, 占比才有业务含义。
  // 店铺累计(shop_total) 不是同一种数, 进分母会得出"OPPO 占 89%"这种假结论, 一律剔除。
  const comparable = rows.filter(r => (r.top_sales_source || 'unknown') === 'single' && r.top_sales != null && r.top_sales > 0);
  const excluded = rows.filter(r => (r.top_sales_source || 'unknown') !== 'single' && r.top_sales != null);

  // 口径混用时: 只用可比组画占比; 若可比组一个都没有 → 明确画"无同口径数据", 不骗人
  if (sStat.mixed) {
    if (!comparable.length) {
      chart.clear();
      chart.setOption({
        backgroundColor: 'transparent',
        title: {
          text: '无可比数据', subtext: '当前品牌销量均为店铺/品牌累计口径\n无法计算占比, 详见下方表格参考组',
          left: 'center', top: '38%',
          textStyle: { color: '#ffb020', fontSize: 16 }, subtextStyle: { color: '#7f9cc0', fontSize: 11, lineHeight: 16 },
        },
      }, true);
      return;
    }
    chart.setOption({
      backgroundColor: 'transparent',
      color: COLORS,
      tooltip: {
        trigger: 'item',
        formatter: (p) => {
          const r = comparable[p.dataIndex] || {};
          return `${p.name}<br/>${salesLabel(r.top_sales_source)}: <b>${fmtWan(p.value)}</b> (${p.percent}%)`;
        },
      },
      legend: { bottom: 0, textStyle: { color: '#cfe3f5' }, itemWidth: 12, itemHeight: 12, type: 'scroll' },
      title: {
        text: '单品销量占比 (可比组)', left: 'center', top: 4,
        textStyle: { color: '#cfe3f5', fontSize: 12, fontWeight: 400 },
        subtext: excluded.length ? `已排除 ${excluded.length} 个店铺累计口径品牌` : '',
        subtextStyle: { color: '#ffb020', fontSize: 10 },
      },
      series: [{
        type: 'pie', radius: ['42%', '64%'], center: ['50%', '52%'],
        data: comparable.map(r => ({ name: r.brand, value: r.top_sales || 0 })),
        label: { color: '#cfe3f5', formatter: '{b}\n{d}%' },
        itemStyle: { borderColor: '#0a1628', borderWidth: 2 },
      }],
    }, true);
    return;
  }

  // 口径一致 → 占比才有意义, 正常画环形
  chart.setOption({
    backgroundColor: 'transparent',
    color: COLORS,
    tooltip: {
      trigger: 'item',
      formatter: (p) => {
        const r = rows[p.dataIndex] || {};
        return `${p.name}<br/>${salesLabel(r.top_sales_source)}: <b>${fmtWan(p.value)}</b> (${p.percent}%)`;
      },
    },
    legend: { bottom: 0, textStyle: { color: '#cfe3f5' }, itemWidth: 12, itemHeight: 12, type: 'scroll' },
    series: [{
      type: 'pie', radius: ['42%', '66%'], center: ['50%', '46%'],
      data: rows.map(r => ({ name: r.brand, value: r.top_sales || 0 })),
      label: { color: '#cfe3f5', formatter: '{b}\n{d}%' },
      itemStyle: { borderColor: '#0a1628', borderWidth: 2 },
    }],
  }, true);
}

function renderInsights(insights, warnings) {
  const el = $('insights'); el.innerHTML = '';
  const kindTag = { tier: '梯队', hot: '热度', gap: '空缺', warning: '数据' };
  (insights || []).forEach(i => {
    const div = document.createElement('div');
    div.className = 'insight insight-' + (i.kind || 'tier');
    div.innerHTML = `<span class="tag">${kindTag[i.kind] || i.kind}</span> <span>${i.body}</span>`;
    el.appendChild(div);
  });
  (warnings || []).forEach(w => {
    const div = document.createElement('div');
    div.className = 'insight insight-warning';
    div.innerHTML = `<span class="tag">说明</span> <span>${w}</span>`;
    el.appendChild(div);
  });
  if (!el.children.length) el.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">暂无洞察</div>';
}

function renderGapNotes(insights) {
  const el = $('gap-notes');
  const gap = (insights || []).filter(i => i.kind === 'gap');
  el.innerHTML = gap.length ? gap.map(g => '<div style="margin-bottom:10px;line-height:1.6;color:var(--text);font-size:13px;">💡 ' + g.body + '</div>').join('') : '<span style="font-size:13px;">无空缺机会洞察</span>';
}

/* 价格分档堆叠柱 */
function renderBucket(brands, rows) {
  const chart = initChart('chart-bucket');
  const keys = [['bucket_under_100', '¥100以内'], ['bucket_100_300', '¥100-300'], ['bucket_300_800', '¥300-800'], ['bucket_over_800', '¥800+']];
  const palette = ['#00eaff', '#38bdf8', '#f5c518', '#f472b6'];
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 46, right: 20, top: 40, bottom: 30 },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    legend: { top: 0, textStyle: { color: '#cfe3f5' } },
    xAxis: { type: 'category', data: brands, axisLine: { lineStyle: { color: '#2a4a6a' } }, axisLabel: { color: '#cfe3f5', interval: 0, fontSize: 12 } },
    yAxis: { type: 'value', axisLabel: { color: '#7f9cc0' }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
    series: keys.map(([k, name], i) => ({
      name, type: 'bar', stack: 'total', barWidth: '46%',
      data: rows.map(r => r[k] || 0), itemStyle: { color: palette[i] },
    })),
  });
}

/* 价格区间(箱线近似 → 用 min/median/max 条形) */
function renderRange(brands, rows) {
  const chart = initChart('chart-range');
  // 用 min / max 画范围, median 画点
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 46, right: 20, top: 30, bottom: 30 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: brands, axisLine: { lineStyle: { color: '#2a4a6a' } }, axisLabel: { color: '#cfe3f5', interval: 0, fontSize: 12 } },
    yAxis: { type: 'value', axisLabel: { color: '#7f9cc0' }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
    series: [
      { type: 'bar', name: '价格区间', barWidth: '40%', data: rows.map(r => r.max || 0), itemStyle: { color: 'rgba(56,189,248,.25)', borderRadius: [4,4,0,0] } },
      { type: 'bar', name: '最小值', barWidth: '40%', data: rows.map(r => r.min || 0), itemStyle: { color: 'rgba(0,224,255,.5)' } },
      { type: 'scatter', name: '中位数', symbolSize: 10, data: rows.map(r => r.median || 0), itemStyle: { color: '#f5c518' } },
    ],
  });
}

/* 卖点横向柱 */
function renderKeywordBar(brands, rows) {
  const chart = initChart('chart-keywords');
  const agg = {};
  rows.forEach(r => (r.top_keywords || []).forEach(k => { agg[k.keyword] = (agg[k.keyword] || 0) + (k.count || 0); }));
  const items = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 10);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 70, right: 20, top: 10, bottom: 20 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'value', axisLabel: { color: '#7f9cc0' }, splitLine: { lineStyle: { color: 'rgba(120,150,180,.15)' } } },
    yAxis: { type: 'category', data: items.map(i => i[0]).reverse(), axisLabel: { color: '#cfe3f5' }, axisLine: { lineStyle: { color: '#2a4a6a' } } },
    series: [{
      type: 'bar', data: items.map(i => i[1]).reverse(), barWidth: '55%',
      itemStyle: { borderRadius: [0,6,6,0], color: new echarts.graphic.LinearGradient(1, 0, 0, 0, [
        { offset: 0, color: '#00eaff' }, { offset: 1, color: '#38bdf8' }]) },
      label: { show: true, position: 'right', color: '#cfe3f5' },
    }],
  });
}

/* 词云 */
function renderWordcloud(brands, rows) {
  const chart = initChart('chart-wordcloud');
  const agg = {};
  rows.forEach(r => (r.top_keywords || []).forEach(k => { agg[k.keyword] = (agg[k.keyword] || 0) + (k.count || 0); }));
  const data = Object.entries(agg).map(([name, value]) => ({ name, value }));
  if (!data.length) { chart.clear(); return; }
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { formatter: p => p.name + ': ' + p.value + ' 次' },
    series: [{
      type: 'wordCloud', shape: 'circle', gridSize: 12, sizeRange: [14, 60], rotationRange: [0, 0],
      textStyle: { color: () => COLORS[Math.floor(Math.random() * COLORS.length)] },
      emphasis: { textStyle: { shadowBlur: 10, shadowColor: '#00eaff' } },
      data,
    }],
  });
}

/* 表格 */
// 表格分两段渲染 (C 方案):
//   段 1「单品销量可比组」—— top_sales_source === 'single', 销量列是真单品销量, 可横向比。
//   段 2「店铺/品牌累计参考组」—— shop_total / unknown, 数不可比, 只作背景参考, 明确标注不入图表。
// 拆表的原因: 同一张表里混排会让读者默认两列同口径, 1700万累计和 5万单品看起来就像"差 340 倍"。
function renderTable(brands, rows) {
  const low = ['¥100以内', '¥100-300', '¥300-800', '¥800+'];
  const groupA = rows.filter(r => (r.top_sales_source || 'unknown') === 'single');
  const groupB = rows.filter(r => (r.top_sales_source || 'unknown') !== 'single');

  /* 2 级表头: 价格分档占 4 个子列
     原来 1 个 <td> 里纵向堆 4 个块级 div → 行高 ×4, 且列宽不够时内容折行 (数据被挤到下一行)。
     现在拆成 4 个独立 <td>, 每段一根横向 bar, 行高回到单行。 */
  const headHtml = (salesHead) =>
    `<tr>`
    + `<th rowspan="2">品牌</th>`
    + `<th rowspan="2">中位价</th>`
    + `<th rowspan="2">价格区间</th>`
    + `<th colspan="4" style="text-align:center;">价格分档 · SKU 数</th>`
    + `<th rowspan="2">高频卖点</th>`
    + `<th rowspan="2">销量冠军</th>`
    + `<th rowspan="2">${salesHead}</th>`
    + `<th rowspan="2">店铺名</th>`
    + `<th rowspan="2">评论数</th>`
    + `</tr><tr>`
    + low.map(l => `<th class="sub">${l}</th>`).join('')
    + `</tr>`;

  const rowHtml = (r) => {
    const buckets = [r.bucket_under_100 || 0, r.bucket_100_300 || 0, r.bucket_300_800 || 0, r.bucket_over_800 || 0];
    const max = Math.max(...buckets) || 1;
    const bucketCells = buckets.map((b, i) => {
      const pct = Math.round(b / max * 100);
      return `<td class="pd-cell" title="${low[i]}：${b} 个 SKU">`
        + `<div class="pd-val">${b}</div>`
        + `<div class="pd-bar" style="width:${b ? pct : 0}%;background:${COLORS[i % COLORS.length]};"></div>`
        + `</td>`;
    }).join('');
    const kws = (r.top_keywords || []).slice(0, 3).map(k => k.keyword).join(' / ');
    const isShop = (r.top_sales_source || 'unknown') !== 'single';
    const salesCell = isShop
      ? `<td class="nowrap" style="color:#ffb020;">${fmtWan(r.top_sales)} `
        + `<span style="font-size:11px;white-space:nowrap;" title="列表页 salesTip, 是店铺/品牌历史累计数, 非该单品销量, 不可与他品牌单品销量并列比较">⚠ 累计</span></td>`
      : `<td class="nowrap">${fmtWan(r.top_sales)}</td>`;
    return `<tr${isShop ? ' style="background:rgba(255,176,32,.05);"' : ''}>`
      + `<td class="nowrap" style="font-weight:600;color:var(--cyan);">${r.brand}</td>`
      + `<td class="nowrap">¥${r.median ?? '—'}</td>`
      + `<td class="nowrap">¥${r.min ?? '—'} ~ ¥${r.max ?? '—'}</td>`
      + bucketCells
      + `<td title="${kws}">${kws || '—'}</td>`
      + `<td title="${r.top_product || ''}">${(r.top_product || '—').slice(0, 16)}${(r.top_product || '').length > 16 ? '…' : ''}</td>`
      + salesCell
      + `<td title="${r.shop_name || ''}">${r.shop_name || '—'}</td>`
      + `<td class="nowrap">${r.comment_count != null ? r.comment_count.toLocaleString() : '—'}</td>`
      + `</tr>`;
  };

  // 只有一组时 (全部同口径) 走原来风格: 常规表头 + 全部行, 不显示分组标题
  if (!groupA.length || !groupB.length) {
    const one = groupA.length ? groupA : groupB;
    const head = one.length ? (one[0].top_sales_source || 'unknown') : 'unknown';
    $('table-head').innerHTML = headHtml(salesLabel(head));
    $('table-body').innerHTML = one.map(rowHtml).join('');
    return;
  }

  // 混口径 → 双组标题行 + 两段数据; thead 用 group header 拆开, tbody 顺序跟随
  $('table-head').innerHTML = headHtml('销量');
  const groupTitleRow = (txt, sub, color) =>
    `<tr><td colspan="12" style="background:${color};color:#e8f4ff;font-size:12px;font-weight:600;`
    + `padding:7px 10px;letter-spacing:.3px;">${txt}<span style="font-weight:400;color:#9fc0dd;margin-left:8px;">${sub}</span></td></tr>`;

  const rowsA = groupA.map(rowHtml).join('');
  const rowsB = groupB.map(rowHtml).join('');
  $('table-body').innerHTML =
    groupTitleRow('① 单品销量可比组', '口径一致 (详情页单品销量), 已进入上方图表参与横向比较', 'rgba(0,234,255,.14)')
    + rowsA
    + groupTitleRow('② 店铺 / 品牌累计参考组', '仅店铺历史累计数, 口径不同, 未进入图表, 请勿与他组数值并列比较', 'rgba(255,176,32,.16)')
    + rowsB;
}

/* ECharts 实例管理 */
function initChart(id) {
  if (!charts[id]) charts[id] = echarts.init(document.getElementById(id));
  return charts[id];
}

/* 时钟 */
function tick() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  $('clock').textContent = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

window.addEventListener('resize', () => Object.values(charts).forEach(c => c && c.resize()));

renderChips();
tick(); setInterval(tick, 1000);
generate();
</script>
